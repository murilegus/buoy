# The docs site (docs/ARCHITECTURE.md, "The docs and their site"). Built only in CI
# (.github/workflows/docs.yml → GitHub Pages), never part of the extension. Preview locally:
#   uvx --with-requirements requirements-docs.txt --from mkdocs mkdocs serve
#   (the pinned versions; http://127.0.0.1:8000, the Vietnamese site under /vi/)
# Every page may have a Vietnamese twin, page.vi.md beside page.md; a page that has only one
# language shows in that language's site.
site_name: Buoy
site_description: A living pill in the GNOME top bar
repo_url: https://github.com/murilegus/buoy
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light}
  features:
    - navigation.sections
    - navigation.indexes
    - search.highlight
    - content.action.edit

markdown_extensions:
  - tables
  # anchors keep accents, as GitHub's do, so a link works in both
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - admonition
  - attr_list
  - md_in_html

# the render scripts and other non-page sources stay in the repo, not on the site
exclude_docs: |
  *.js
  *.sh
  render/

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          # Design is only its landing page until the pages are translated
          nav:
            - Buoy: index.md
            - Design: design/index.md
            - Product: &product
                - SPEC.md
                - FEATURES.md
                - PRIORITY.md
                - INDICATORS.md
                - NOTIFICATIONS.md
                - GREETING.md
                - MASCOT.md
            - Build on Buoy: &build
                - ARCHITECTURE.md
                - CONTRACT.md
                - DBUS.md
                - PROFILES.md
                - CODING-AGENTS.md
            - Releases: &releases
                - releases/0.1.md
                - releases/0.1.1.md
        - locale: vi
          name: Tiếng Việt
          build: true
          nav:
            - Buoy: index.md
            - Thiết kế:
                - design/index.md
                - Bảng số: design/tokens.md
                - Bảng màu: design/colours.md
                - Pill: design/pill/index.md
                - Compact: design/compact/index.md
                - Alert và ask: design/alerts-and-asks/index.md
                - Expanded: design/expanded/index.md
                - Tab: design/tabs/index.md
                - Icon: design/icons/index.md
                - Bu: design/mascot/index.md
            - Sản phẩm (tiếng Anh): *product
            - Xây trên Buoy (tiếng Anh): *build
            - Bản phát hành: *releases

