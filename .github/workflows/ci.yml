name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Same gjs (1.88) and GLib as GNOME Shell 50; Node comes from pnpm devEngines.runtime.
    container: ubuntu:26.04
    steps:
      - name: Install gjs and GLib tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gjs libglib2.0-bin git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify
